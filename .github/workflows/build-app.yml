name: Build app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "*.*.*"
      - "test.*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name == 'push' && startsWith(github.ref_name, 'test.')) && '[{"name":"macos","runner":"macos-latest","artifact":"musical-macos"}]' || '[{"name":"macos","runner":"macos-latest","artifact":"musical-macos"},{"name":"windows","runner":"windows-latest","artifact":"musical-windows"},{"name":"linux","runner":"ubuntu-24.04","artifact":"musical-linux"}]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check Rust
        working-directory: src-tauri
        run: cargo check

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri bundle
        run: npm run tauri -- build

      - name: Sign macOS app bundle
        if: matrix.platform.name == 'macos'
        shell: bash
        run: |
          codesign --force --deep --sign - "src-tauri/target/release/bundle/macos/Musical.app"
          codesign --verify --deep --strict --verbose=4 "src-tauri/target/release/bundle/macos/Musical.app"

      - name: Archive app bundle
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.platform.name }}" = "macos" ]; then
            tar -C src-tauri/target/release/bundle/macos -czf "artifacts/${{ matrix.platform.artifact }}.tar.gz" Musical.app
          else
            tar -C src-tauri/target/release/bundle -czf "artifacts/${{ matrix.platform.artifact }}.tar.gz" .
          fi

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact }}
          path: artifacts/${{ matrix.platform.artifact }}.tar.gz
          if-no-files-found: error
