name: Build app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "*.*.*"
      - "test.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name == 'push' && startsWith(github.ref_name, 'test.')) && '[{"name":"macos","runner":"macos-latest","artifact":"musical-macos"}]' || '[{"name":"macos","runner":"macos-latest","artifact":"musical-macos"},{"name":"windows","runner":"windows-latest","artifact":"musical-windows"},{"name":"linux","runner":"ubuntu-24.04","artifact":"musical-linux"}]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libarchive-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Test MCP sidecar
        run: npm run test:mcp

      - name: Test release packaging verifier
        run: npm run test:release-packaging

      - name: Build frontend
        run: npm run build

      - name: Check Rust
        working-directory: src-tauri
        run: cargo check

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri bundle
        if: matrix.platform.name != 'windows'
        run: npm run tauri -- build

      - name: Build Windows installers with updater
        if: matrix.platform.name == 'windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY secret is required for updater-enabled Windows installers."
          }
          if (-not $env:TAURI_UPDATER_PUBKEY) {
            throw "TAURI_UPDATER_PUBKEY repository variable is required for updater-enabled Windows installers."
          }
          node scripts/write-tauri-updater-config.mjs src-tauri/tauri-updater.generated.conf.json
          npm run tauri -- build --bundles msi,nsis --config src-tauri/tauri-updater.generated.conf.json

      - name: Smoke release app MCP bridge
        if: matrix.platform.name == 'windows'
        run: npm run smoke:release-app -- --executable=src-tauri/target/release/musical.exe

      - name: Verify staged release payload
        shell: bash
        run: |
          node scripts/verify-release-bundle.mjs \
            --platform=staging \
            --root=src-tauri/target/release \
            --frontend-dist=dist \
            --smoke-sidecar

      - name: Sign macOS app bundle
        if: matrix.platform.name == 'macos'
        shell: bash
        run: |
          codesign --force --deep --sign - "src-tauri/target/release/bundle/macos/Musical.app"
          codesign --verify --deep --strict --verbose=4 "src-tauri/target/release/bundle/macos/Musical.app"

      - name: Verify macOS app bundle
        if: matrix.platform.name == 'macos'
        shell: bash
        run: |
          node scripts/verify-release-bundle.mjs \
            --platform=macos \
            --root=src-tauri/target/release/bundle/macos/Musical.app \
            --frontend-dist=dist \
            --smoke-sidecar

      - name: Verify Windows installers
        if: matrix.platform.name == 'windows'
        shell: pwsh
        run: |
          ./scripts/verify-windows-installers.ps1 `
            -MsiDirectory "src-tauri/target/release/bundle/msi" `
            -NsisDirectory "src-tauri/target/release/bundle/nsis" `
            -FrontendDist "dist" `
            -Verifier "scripts/verify-release-bundle.mjs" `
            -RunnerTemp $env:RUNNER_TEMP

      - name: Verify Linux packages
        if: matrix.platform.name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          rpms=(src-tauri/target/release/bundle/rpm/*.rpm)
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if (( ${#debs[@]} == 0 )); then
            echo "No Debian installer found in src-tauri/target/release/bundle/deb." >&2
            exit 1
          fi
          if (( ${#rpms[@]} == 0 )); then
            echo "No RPM installer found in src-tauri/target/release/bundle/rpm." >&2
            exit 1
          fi
          if (( ${#appimages[@]} == 0 )); then
            echo "No AppImage found in src-tauri/target/release/bundle/appimage." >&2
            exit 1
          fi

          deb_temp_roots=()
          rpm_temp_roots=()
          appimage_temp_roots=()
          cleanup_linux_temp_roots() {
            for deb_temp_root in "${deb_temp_roots[@]}"; do
              rm -rf -- "$deb_temp_root"
            done
            for rpm_temp_root in "${rpm_temp_roots[@]}"; do
              rm -rf -- "$rpm_temp_root"
            done
            for appimage_temp_root in "${appimage_temp_roots[@]}"; do
              rm -rf -- "$appimage_temp_root"
            done
          }
          trap cleanup_linux_temp_roots EXIT

          for deb in "${debs[@]}"; do
            deb_temp_root="$(mktemp -d)"
            deb_temp_roots+=("$deb_temp_root")
            dpkg-deb -x "$deb" "$deb_temp_root"
            node scripts/verify-release-bundle.mjs \
              --platform=linux \
              --root="$deb_temp_root" \
              --frontend-dist=dist \
              --smoke-sidecar
          done

          for rpm in "${rpms[@]}"; do
            rpm_temp_root="$(mktemp -d)"
            rpm_temp_roots+=("$rpm_temp_root")
            bsdtar -xf "$rpm" -C "$rpm_temp_root"
            node scripts/verify-release-bundle.mjs \
              --platform=linux \
              --root="$rpm_temp_root" \
              --frontend-dist=dist \
              --smoke-sidecar
          done

          for appimage in "${appimages[@]}"; do
            appimage_temp_root="$(mktemp -d)"
            appimage_temp_roots+=("$appimage_temp_root")
            appimage_path="$(realpath "$appimage")"
            (
              cd "$appimage_temp_root"
              "$appimage_path" --appimage-extract
            )
            appimage_bundle_root="$appimage_temp_root/squashfs-root"
            if [ ! -d "$appimage_bundle_root" ]; then
              echo "AppImage extraction did not create $appimage_bundle_root." >&2
              exit 1
            fi
            node scripts/verify-release-bundle.mjs \
              --platform=linux \
              --root="$appimage_bundle_root" \
              --frontend-dist=dist \
              --smoke-sidecar
          done

      - name: Collect app bundle
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.platform.name }}" = "macos" ]; then
            tar -C src-tauri/target/release/bundle/macos -czf "artifacts/${{ matrix.platform.artifact }}.tar.gz" Musical.app
          elif [ "${{ matrix.platform.name }}" = "windows" ]; then
            cp src-tauri/target/release/bundle/msi/*.msi artifacts/
            cp src-tauri/target/release/bundle/nsis/*.exe artifacts/
            cp src-tauri/target/release/bundle/nsis/*.exe.sig artifacts/
          else
            tar -C src-tauri/target/release/bundle -czf "artifacts/${{ matrix.platform.artifact }}.tar.gz" .
          fi

      - name: Generate Windows updater manifest
        if: matrix.platform.name == 'windows' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          node scripts/write-tauri-windows-latest-json.mjs artifacts artifacts/latest.json
          rm artifacts/*.sig

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

      - name: Publish Windows release assets
        if: matrix.platform.name == 'windows' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* --title "${GITHUB_REF_NAME}" --notes "Automated Windows build for ${GITHUB_REF_NAME}"
          fi
