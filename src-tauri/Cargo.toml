[package]
name = "musical"
version = "0.6.5"
description = "Lightweight cross-platform music player and album manager"
authors = ["circularmoonray"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "musical_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
encoding_rs = "0.8.35"
base64 = "0.22"
fastembed = { version = "=5.17.4", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
hf-hub = { version = "=0.5.0", default-features = false, features = ["ureq"] }
include_dir = "0.7"
lindera = { version = "=5.1.0", default-features = false, features = ["embed-ipadic"] }
# Exact direct constraints keep analyzer/cache identity aligned with Lindera's
# otherwise-caret transitive dictionary crates.
lindera-dictionary = { version = "=5.1.0", default-features = false }
lindera-ipadic = { version = "=5.1.0", default-features = false }
lofty = "0.24.0"
jwalk = "0.8.1"
log = "0.4"
md5 = "0.7"
rustfft = "6.4.1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
symphonia = { version = "0.5.5", features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }

tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2.10.1"
# Keep FastEmbed's tokenizer backend while excluding the unused esaxx C++
# trainer, whose static MSVC CRT conflicts with the downloaded ORT binaries.
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
unicode-normalization = "=0.1.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

# Keep useful line information for the application while avoiding full debug
# symbols for every dependency. This prevents routine dev/test builds from
# multiplying into tens of gigabytes across macOS and Windows.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[profile.test]
debug = 1

[profile.test.package."*"]
debug = false
